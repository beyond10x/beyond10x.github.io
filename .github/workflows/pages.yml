name: Deploy organization Pages

on:
  workflow_dispatch:
    inputs:
      published_sha:
        description: Immutable commit on the published branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: organization-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'b10x-bot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Validate immutable revision
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        run: |
          if ! printf '%s' "$PUBLISHED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'published_sha must be a full Git commit' >&2
            exit 1
          fi

      - name: Check out generated artifact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.published_sha }}
          persist-credentials: false

      - name: Verify deployment provenance
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        run: |
          test -f PROVENANCE.json
          test -f .well-known/b10x-docs.json
          test "$(git rev-parse HEAD)" = "$PUBLISHED_SHA"
          jq -e '.website.commit | test("^[0-9a-f]{40}$")' PROVENANCE.json >/dev/null
          jq -e '.routes | type == "array" and length > 0' .well-known/b10x-docs.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
