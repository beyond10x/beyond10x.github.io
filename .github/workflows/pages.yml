name: Deploy organization Pages

on:
  workflow_dispatch:
    inputs:
      published_sha:
        description: Immutable commit on the published branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: organization-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'b10x-bot[bot]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .deployment-controls
          persist-credentials: false

      - name: Validate immutable revision
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        run: |
          if ! printf '%s' "$PUBLISHED_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || printf '%s' "$PUBLISHED_SHA" | grep -Eq '^0+$'; then
            echo 'published_sha must be a non-zero full lowercase Git commit' >&2
            exit 1
          fi

      - name: Check out generated artifact
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.published_sha }}
          path: _site
          fetch-depth: 1
          persist-credentials: false

      - name: Verify artifact contract
        run: node .deployment-controls/scripts/verify-artifact.mjs _site

      - name: Read commit attributions
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/b10x-pages-verification"
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$PUBLISHED_SHA" \
            > "$RUNNER_TEMP/b10x-pages-verification/publisher-commit.json"
          WEBSITE_COMMIT=$(node -e \
            "process.stdout.write(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).websiteCommit ?? '')" \
            _site/PROVENANCE.json)
          if ! printf '%s' "$WEBSITE_COMMIT" | grep -Eq '^[0-9a-f]{40}$' \
            || printf '%s' "$WEBSITE_COMMIT" | grep -Eq '^0+$'; then
            echo 'artifact provenance has an invalid Website commit' >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --location --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/beyond10x/website/commits/$WEBSITE_COMMIT" \
            > "$RUNNER_TEMP/b10x-pages-verification/website-commit.json"

      - name: Verify immutable publication boundary
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        run: |
          .deployment-controls/scripts/verify-git-boundary.sh \
            _site \
            "$PUBLISHED_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "$GITHUB_SERVER_URL/beyond10x/website.git" \
            "$RUNNER_TEMP/b10x-pages-verification/publisher-commit.json" \
            "$RUNNER_TEMP/b10x-pages-verification/website-commit.json"

      - name: Remove checkout metadata from artifact
        run: rm -rf -- _site/.git

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
